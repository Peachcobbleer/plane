<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight Sim Foundation</title>
<style>
  :root { --bg:#9cbbe0; --fg:#fff; --pn:rgba(10,20,35,.6); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#9cbbe0; --fg:#fff; --pn:rgba(10,20,35,.7); } }
  :root[data-theme="dark"] { --bg:#9cbbe0; --fg:#fff; --pn:rgba(10,20,35,.7); }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--fg); }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; left:12px; bottom:12px; padding:8px 12px; background:var(--pn); border-radius:8px; font-size:13px; line-height:1.5; pointer-events:none; }
  #help { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(10,20,35,.55); cursor:pointer; text-align:center; font-size:14px; line-height:1.8; }
  #help b { font-size:20px; display:block; margin-bottom:8px; }
  #swap { margin:6px 0 2px; padding:8px 12px; font:inherit; color:#fff; background:#1d4ed8; border:0; border-radius:8px; cursor:pointer; }
  #swap:hover { background:#2563eb; }
  #swap option { color:#000; background:#fff; }
  #pinfo { opacity:.8; margin-bottom:10px; }
  #sunfx { position:fixed; inset:0; pointer-events:none; overflow:hidden; opacity:0; mix-blend-mode:screen; }
  #sunfx::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at var(--sx) var(--sy), rgba(255,200,110,.38), rgba(255,160,70,.14) 45%, transparent 85%); }
  #sunrays { position:absolute; left:var(--sx); top:var(--sy); width:260vmax; height:260vmax; margin:-130vmax 0 0 -130vmax;
    background:radial-gradient(circle, rgba(255,252,235,1) 0, rgba(255,235,170,.9) .6%, rgba(255,205,120,.5) 2.5%, rgba(255,175,80,.2) 9%, transparent 22%),
      conic-gradient(transparent 0deg, transparent 12.5deg, rgba(255,236,176,0.2) 14deg, transparent 16.5deg, transparent 150.5deg, rgba(255,236,176,0.3) 152deg, transparent 154.5deg, transparent 165.5deg, rgba(255,236,176,0.42) 167deg, transparent 169.5deg, transparent 178.5deg, rgba(255,236,176,0.34) 180deg, transparent 182.5deg, transparent 191.5deg, rgba(255,236,176,0.46) 193deg, transparent 195.5deg, transparent 206.5deg, rgba(255,236,176,0.3) 208deg, transparent 210.5deg, transparent 222.5deg, rgba(255,236,176,0.24) 224deg, transparent 226.5deg, transparent 338.5deg, rgba(255,236,176,0.16) 340deg, transparent 342.5deg, transparent 360deg);
    -webkit-mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.6) 8%, transparent 30%); mask-image:radial-gradient(circle, #000 0, rgba(0,0,0,.6) 8%, transparent 30%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sunfx"><div id="sunrays"></div></div>
<div id="hud"></div>
<div id="help"><div><b>Click to fly</b>
<select id="swap" title="Choose aircraft"></select>
<div id="pinfo"></div>
<label style="display:inline-flex;gap:8px;align-items:center;justify-content:center;margin:0 0 10px">Sound <input id="soundvol" type="range" min="0" max="100" value="48" style="width:140px;vertical-align:middle"></label><br>
Mouse: look around the plane (cursor locked) · Esc: release<br>
W / S: pitch down / up · A / D: roll · Q / E: rudder<br>
Shift / C: throttle up / down · Space: brakes · R: reset · G: gear (auto-retracts after takeoff)<br>
Full throttle, hold roll, pull back gently at rotate speed to take off.</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const { Vector3: V3, Quaternion: Q, Euler } = THREE;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

// ---------- scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7fb0e6);
const camera = new THREE.PerspectiveCamera(65, 1, 0.3, 8000);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x4d5842, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(420, 300, 260);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);       // shadow box follows the plane (see frame loop)
Object.assign(sun.shadow.camera, { left: -350, right: 350, top: 350, bottom: -350, near: 1, far: 1800 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun.target);
scene.add(sun);

// (terrain, trees, towns, clouds and the runway are generated in chunks by the procedural world section below)

// ---------- models (nose points -Z, +Y up, +X right) ----------
let cur;
const mat = (c, o = {}) => { const { flatShading, ...rest } = o; return new THREE.MeshLambertMaterial({ color: c, ...rest }); };   // r128 Lambert has no flatShading option
const white = mat(0xf2f2ee), red = mat(0xc0392b), dark = mat(0x2b2b2b), glass = mat(0x6fa8d6);
const wsm = mat(0xf2f2ee, { flatShading: false }), navy = mat(0x0b1f6b), blue = mat(0x0f2f94, { flatShading: false });
function add(geo, m, x, y, z, parent = cur) {
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); parent.add(o); return o;
}

const sm = c => mat(c, { flatShading: false }), grey = mat(0x9aa0a8), teal = mat(0x7fb9a6);
function lathe(prof, m, o = {}) {                                // smooth body of revolution along Z
  const g = new THREE.LatheGeometry(prof.map(([r, y]) => new THREE.Vector2(r + (o.k || 0), y)), 32, o.a || 0, o.b || Math.PI * 2);
  if (o.uv) { const p = g.attributes.position, uv = g.attributes.uv; for (let i = 0; i < p.count; i++) uv.setY(i, o.uv(p.getY(i))); }
  return add(g.rotateX(Math.PI / 2), m, 0, 0, 0, o.parent);
}
const mirror = g => { const m = g.clone(); m.scale.x = -1; cur.add(m); };
const tire = (x, y, z, r, w, parent) => {
  add(new THREE.CylinderGeometry(r, r, w, 18), dark, x, y, z, parent).rotation.z = Math.PI / 2;
  add(new THREE.CylinderGeometry(r * 0.55, r * 0.55, w + 0.02, 12), grey, x, y, z, parent).rotation.z = Math.PI / 2;
};
const slab = (pts, depth) => {                                   // flat swept plate from [x, z] points (z+ = aft)
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z))), { depth, bevelEnabled: false });
  return g.rotateX(-Math.PI / 2);
};
const mkTex = (w, h, draw) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
};

const pivot = (x, y, z) => {                                     // retractable gear leg: scales up into the airframe about its attach point
  const p = new THREE.Group(); p.position.set(x, y, z); cur.add(p);
  (cur.userData.gear = cur.userData.gear || []).push(p); return p;
};

function buildTrainer() {
  const plane = cur = new THREE.Group(), redS = sm(0xc0392b);
  const fp = [[0.05, -3.9], [0.45, -3.8], [0.62, -3.5], [0.68, -3.0], [0.7, -2.0], [0.72, -1.2], [0.68, 0], [0.55, 1.2], [0.38, 2.4], [0.22, 3.3], [0.12, 3.55]];
  lathe(fp, wsm);                                                // tapered fuselage
  lathe(fp.slice(0, 4), redS, { k: 0.012 });                     // red cowling
  add(new THREE.SphereGeometry(1, 16, 10), sm(0x6fa8d6), 0, 0.3, -0.8).scale.set(0.58, 0.46, 1.3);   // canopy
  const wing = new THREE.Group(), hw = new THREE.Group(); hw.rotation.z = 0.03; wing.add(hw);
  add(slab([[0, -1.7], [5.5, -1.45], [5.5, -0.4], [0, 0]], 0.1), white, 0, 0.74, 0, hw);
  add(new THREE.BoxGeometry(0.12, 0.12, 1.06), red, 5.5, 0.8, -0.93, hw);
  add(new THREE.BoxGeometry(0.07, 2.4, 0.12), white, 1.59, 0.15, -0.8, wing).rotation.z = -1.0;  // wing strut, fuselage to wing
  plane.add(wing); mirror(wing);
  const fs = new THREE.Shape();
  fs.moveTo(-1.3, 0.5); fs.lineTo(-2.7, 1.7); fs.lineTo(-3.4, 1.7); fs.lineTo(-3.45, 0.1);
  add(new THREE.ExtrudeGeometry(fs, { depth: 0.08, bevelEnabled: false }).rotateY(Math.PI / 2), redS, -0.04, 0, 0);
  const tail = new THREE.Group();
  add(slab([[0, 2.1], [1.8, 2.55], [1.8, 3.3], [0, 3.5]], 0.07), white, 0, 0.18, 0, tail);
  plane.add(tail); mirror(tail);
  for (const s of [-1, 1]) {                                     // main gear legs run from the fuselage to the wheels
    const P = pivot(s * 0.8, -0.35, -0.4);
    add(new THREE.BoxGeometry(0.08, 0.8, 0.1), dark, 0, -0.375, 0, P).rotation.z = s * 0.93;
    tire(s * 0.3, -0.6, 0, 0.25, 0.14, P);
  }
  const NP = pivot(0, -0.5, -2.9);
  add(new THREE.BoxGeometry(0.07, 0.5, 0.07), dark, 0, -0.28, 0, NP); tire(0, -0.45, 0, 0.22, 0.12, NP);
  const prop = new THREE.Group(); prop.position.set(0, 0, -4.15); plane.add(prop);
  add(new THREE.BoxGeometry(0.14, 2.1, 0.05), dark, 0, 0, 0, prop);
  add(new THREE.ConeGeometry(0.2, 0.45, 12), redS, 0, 0, -0.15, prop).rotation.x = -Math.PI / 2;
  plane.userData.prop = prop;
  return plane;
}

// fuselage skin for the A321: u = around (0 = belly, .25 = starboard, .75 = port), v = nose to tail
const bodyTex = L => mkTex(1024, Math.round((L.len || 44) * 64), (x, W, H) => {
  const sx = 1024 / (628.32 * (L.R || 2));                       // px per cm around the circumference
  x.fillStyle = L.base || '#f4f4f0'; x.fillRect(0, 0, W, H);
  x.fillStyle = L.belly; x.fillRect(0, 0, W * 0.11, H); x.fillRect(W * 0.89, 0, W * 0.11, H);   // belly stripe
  for (const port of [0, 1]) {
    x.setTransform(0, port ? -0.64 : 0.64, port ? sx : -sx, 0, port ? 768 : 256, H / 2);   // draw in cm, as seen from outside
    const zx = z => (port ? z : -z) * 100, doors = L.doors || [-15.3, -4.8, 10.5];
    if (L.deco) L.deco(x, zx);
    x.fillStyle = '#1c2b4a';
    const [w0, w1] = L.win || [12, -6];
    for (let z = w0; z > w1; z -= 0.5) {
      if (doors.some(d => Math.abs(z - d) < 0.9)) continue;
      x.beginPath(); x.ellipse(zx(z), -65, 11, 15, 0, 0, 7); x.fill();
    }
    x.strokeStyle = '#9aa3b2'; x.lineWidth = 3;
    for (const d of doors) { x.beginPath(); x.roundRect(zx(d) - 45, -165, 90, 175, 18); x.stroke(); }
    x.fillStyle = '#14202e';
    for (const z0 of [-20.1, -19.5, -18.9]) x.fillRect(zx(z0 - (L.len || 44) / 2 + 22) - 20, -115, 45, 45);               // cockpit side windows
    x.fillStyle = L.textColor; x.font = L.font;
    x.textAlign = port ? 'left' : 'right'; x.fillText(L.title, zx(L.titleZ ?? -14.4), L.titleY ?? 10);
  }
  x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#14202e';
  x.fillRect(W * 0.42, H - 147, W * 0.16, 52);                                                      // windshield
});
const jetFinTex = mirror => mkTex(512, 512, (x, w, h) => {         // mosaic scales + white title
  x.fillStyle = '#0d3b91'; x.fillRect(0, 0, w, h);
  const cols = ['#0d3b91', '#1a62c4', '#2f9be0', '#6cc8f0', '#9adcf5'];
  for (let r = 0; r < 14; r++) for (let c = -1; c < 9; c++) {
    x.fillStyle = cols[(((c * 2 + r * 3) % 5) + 5) % 5];
    x.beginPath(); x.arc(c * 64 + (r % 2 ? 32 : 0), r * 38, 42, 0, 7); x.fill();
  }
  x.save(); if (mirror) { x.translate(w, 0); x.scale(-1, 1); }
  x.translate(mirror ? w - 215 : 215, 330); x.rotate(mirror ? 0.12 : -0.12);   // kept inside the fin's slanted leading edge
  x.font = 'italic 700 84px Arial, sans-serif'; x.textAlign = 'center'; x.lineJoin = 'round';
  x.lineWidth = 8; x.strokeStyle = '#0a2a70'; x.strokeText('jetBlue', 0, 0);
  x.fillStyle = '#fff'; x.fillText('jetBlue', 0, 0);
  x.restore();
});
const sunFinTex = mirror => mkTex(512, 512, (x, w, h) => {      // Allegiant: orange sunburst rising from the fin's leading root
  x.fillStyle = '#1f5fc4'; x.fillRect(0, 0, w, h);
  x.save(); if (mirror) { x.translate(w, 0); x.scale(-1, 1); }
  const cx0 = w * 0.9, cy0 = h * 1.02, N = 13;
  for (let i = 0; i < N; i++) {
    const a0 = Math.PI + (i / N) * Math.PI * 1.05, a1 = Math.PI + ((i + 0.62) / N) * Math.PI * 1.05;
    x.fillStyle = i % 2 ? '#12348a' : '#f7941d';
    x.beginPath(); x.moveTo(cx0, cy0); x.arc(cx0, cy0, 900, a0, a1); x.closePath(); x.fill();
  }
  x.fillStyle = '#ffb54a'; x.beginPath(); x.arc(cx0, cy0, 70, Math.PI, 2 * Math.PI); x.fill();
  x.restore();
});

const swFinTex = mirror => mkTex(512, 512, (x, w, h) => {        // Southwest: blue fin with red / orange / yellow stripes sweeping up the leading root
  x.fillStyle = '#2a43a8'; x.fillRect(0, 0, w, h);
  x.save(); if (mirror) { x.translate(w, 0); x.scale(-1, 1); }
  [['#ffbf27', 0], ['#f26b21', 46], ['#d62828', 92]].forEach(([c, o]) => {
    x.fillStyle = c; x.beginPath();
    x.moveTo(0, h * 0.55 + o); x.lineTo(w * 0.55 + o * 0.6, 0); x.lineTo(w * 0.55 + o * 0.6 + 400, 0); x.lineTo(w * 0.55 + o * 0.6 + 400, h); x.lineTo(0, h); x.closePath(); x.fill();
  });
  x.fillStyle = '#2a43a8'; x.beginPath(); x.moveTo(0, h * 0.55 + 138); x.lineTo(w * 0.55 + 83, 0); x.lineTo(w, 0); x.lineTo(w, h); x.lineTo(0, h); x.closePath(); x.fill();
  x.restore();
});
const fedFinTex = mirror => mkTex(512, 512, (x, w, h) => {        // FedEx: solid purple fin with a faint lighter leading-edge sheen
  x.fillStyle = '#4d148c'; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,255,255,.07)'; x.beginPath(); x.moveTo(0, 0); x.lineTo(w * 0.22, 0); x.lineTo(0, h * 0.5); x.fill();
});
const aaFinTex = mirror => mkTex(512, 512, (x, w, h) => {        // American: red/white stripes aft, blue/white stripes forward
  x.save(); if (mirror) { x.translate(w, 0); x.scale(-1, 1); }
  x.fillStyle = '#e4e7ec'; x.fillRect(0, 0, w, h);
  const bh = 36;
  for (let r = 0; r < 15; r++) {
    const y0 = r * bh, y1 = y0 + bh - 5, xa = w * (0.3 + 0.3 * y0 / h), xb = w * (0.3 + 0.3 * y1 / h);
    x.fillStyle = r % 2 ? '#e4e7ec' : '#c52035';
    x.beginPath(); x.moveTo(0, y0); x.lineTo(xa, y0); x.lineTo(xb, y1); x.lineTo(0, y1); x.fill();
    x.fillStyle = r % 2 ? '#c9d6ea' : '#1b5ba8';
    x.beginPath(); x.moveTo(xa, y0); x.lineTo(w, y0); x.lineTo(w, y1); x.lineTo(xb, y1); x.fill();
  }
  x.restore();
});

const LIV = {
  jetblue: { belly: '#0b1f6b', textColor: '#0a3a9e', font: 'italic 700 200px Arial, sans-serif', title: 'jetBlue',
    finCore: 0x0f2f94, accent: blue, fin: jetFinTex, deco: null },
  allegiant: { belly: '#1f5fc4', textColor: '#1f5fc4', font: 'bold 190px Arial, sans-serif', title: 'allegiant',
    finCore: 0x1f5fc4, accent: mat(0x1f5fc4, { flatShading: false }), fin: sunFinTex,
    cut: 3, span: 16.5, eng: 0.94,                               // A320: shorter fuselage, shorter wing, smaller engines
    deco: (x, zx) => {
      x.fillStyle = '#1f5fc4';                                   // blue lower rear fuselage, sweeping up toward the tail
      x.beginPath(); x.moveTo(zx(21.5), 330); x.lineTo(zx(21.5), -25);
      x.bezierCurveTo(zx(12), 5, zx(4), 25, zx(-3), 75);
      x.bezierCurveTo(zx(-8), 110, zx(-12), 160, zx(-15), 330); x.closePath(); x.fill();
      x.fillStyle = '#f58220';                                   // orange swoosh ahead of the wing
      x.beginPath(); x.moveTo(zx(-3), -45); x.quadraticCurveTo(zx(1), 20, zx(11.5), 100);
      x.quadraticCurveTo(zx(6), -10, zx(0.5), -45); x.closePath(); x.fill();
    } },
  southwest: { base: '#2a43a8', belly: '#2a43a8', textColor: '#ffffff', font: 'bold 175px Arial, sans-serif', title: 'Southwest',
    finCore: 0x2a43a8, accent: mat(0x2a43a8, { flatShading: false }), fin: swFinTex,
    cut: 2, span: 17, eng: 0.97,                                 // 737-800: a little shorter than the A321, slightly smaller engines
    deco: (x, zx) => {                                           // red / orange / yellow bands sweeping up the rear fuselage
      [['#ffbf27', 0], ['#f26b21', 2.2], ['#d62828', 4.4]].forEach(([c, o]) => {
        x.fillStyle = c;
        x.beginPath(); x.moveTo(zx(21.5), 330); x.lineTo(zx(21.5), -25);
        x.bezierCurveTo(zx(12 + o), 5, zx(4 + o), 25, zx(-3 + o), 75);
        x.bezierCurveTo(zx(-8 + o), 110, zx(-12 + o), 160, zx(-15 + o), 330); x.closePath(); x.fill();
      });
    } },
  fedex: { belly: '#dfe2e6', title: '', win: [-40, -41], finCore: 0x4d148c, accent: mat(0xe9ecef, { flatShading: false }), fin: fedFinTex,
    cut: 0, span: 17.4, eng: 1.05,
    deco: (x, zx) => {
      x.fillStyle = '#4d148c';                                   // purple rear fuselage sweeping up into the tail
      x.beginPath(); x.moveTo(zx(21.5), 330); x.lineTo(zx(21.5), -330);
      x.bezierCurveTo(zx(14), -330, zx(9), -300, zx(5), -170);
      x.bezierCurveTo(zx(3), -60, zx(0), 120, zx(-4), 330); x.closePath(); x.fill();
      const port = zx(1) > 0, a = zx(-14.4);                     // FedEx wordmark: purple "Fed", orange "Ex"
      x.font = 'italic bold 300px Arial, sans-serif'; x.textAlign = port ? 'left' : 'right';
      const wF = x.measureText('Fed').width, wE = x.measureText('Ex').width;
      x.fillStyle = '#4d148c'; x.fillText('Fed', port ? a : a - wE, 20);
      x.fillStyle = '#ff6200'; x.fillText('Ex', port ? a + wF : a, 20);
    } },
  american: { len: 57, R: 2.9, base: '#cdd2d8', belly: '#a5acb6', textColor: '#1c4f86', font: 'bold 255px Arial, sans-serif',
    title: 'American', titleZ: -21.5, titleY: -95, doors: [-24, -16, 1.5, 14], win: [12, -21.5],
    finCore: 0xd5d9e0, accent: mat(0xd5dae0, { flatShading: false }), fin: aaFinTex,
    deco: (x, zx) => {
      for (let k = 0; k < 6; k++) {                              // red/white stripes on the rear fuselage
        const yb = 120 - 42 * k, zf = 11.7 + 0.7 * k;
        x.fillStyle = k % 2 ? '#e4e7ec' : '#c52035';
        x.beginPath(); x.moveTo(zx(zf), yb); x.lineTo(zx(30), yb); x.lineTo(zx(30), yb - 40); x.lineTo(zx(zf), yb - 40); x.closePath(); x.fill();
      }
      x.fillStyle = '#1d6fc1';                                   // flight symbol near the cockpit
      x.beginPath(); x.moveTo(zx(-23.2), -200); x.lineTo(zx(-22.6), -200); x.lineTo(zx(-21.8), -150); x.lineTo(zx(-22.4), -150); x.closePath(); x.fill();
      x.fillStyle = '#c52035';
      x.beginPath(); x.moveTo(zx(-22.9), -135); x.lineTo(zx(-22.2), -135); x.lineTo(zx(-22.6), -95); x.lineTo(zx(-23.3), -95); x.closePath(); x.fill();
    } }
};

function buildAirliner(L) {                                      // Airbus A321neo-class airliner; livery passed in as L
  const g = cur = new THREE.Group(), cut = L.cut || 0, SP = L.span || 17.4;   // cut = metres removed from the rear fuselage (A320)
  const prof = [[0.05, -22], [0.6, -21.7], [1.1, -21], [1.5, -20], [1.8, -18.8], [1.95, -17], [2, -15], [2, 12 - cut], [1.9, 14.5 - cut], [1.6, 17 - cut], [1.15, 19.5 - cut], [0.6, 21.2 - cut], [0.2, 22 - cut]];
  lathe(prof, mat(0xffffff, { map: bodyTex(L), flatShading: false }), { uv: y => (y + 22) / (44 - cut) });
  add(new THREE.SphereGeometry(1, 20, 12), wsm, 0, -1.5, 1.2).scale.set(1.9, 0.6, 5.5);   // wing-body fairing

  // tail fin: root runs down into the tail cone
  const sh = new THREE.Shape();
  sh.moveTo(-11 + cut, 1.8); sh.lineTo(-17.2 + cut, 10.4); sh.lineTo(-20.9 + cut, 10.4); sh.lineTo(-21 + cut, 0.45);
  const fg = new THREE.ShapeGeometry(sh), pa = fg.attributes.position, uv = fg.attributes.uv;
  for (let i = 0; i < pa.count; i++) uv.setXY(i, (pa.getX(i) + 21 - cut) / 10, (pa.getY(i) - 0.45) / 9.95);
  const tp = y => 0.22 * (1 - 0.65 * (y - 0.45) / 9.95);          // half-thickness: thick root, thin tip

};
const KEYS = Object.keys(PLANES), models = {};
let C = PLANES.trainer, pkey = 'trainer', model = null, QREF = 0, dist = 16;

// ---------- flight model ----------
const G = 9.81, RHO = 1.225;
const st = { pos: new V3(), vel: new V3(), q: new Q(), w: new V3(), thr: 0 };
const ctl = { elev: 0, ail: 0, rud: 0 };
const keys = {};
let info = { aoa: 0, V: 0, air: false };

const CL = a => clamp(0.25 + 5.0 * a, -1.15, 1.65);

function step(dt) {
  const tgt = (p, n) => (keys[p] ? 1 : 0) - (keys[n] ? 1 : 0);
  const k = Math.min(1, dt * C.ctlRate);
  ctl.elev += (tgt('KeyS', 'KeyW') - ctl.elev) * k;
  ctl.ail  += (tgt('KeyD', 'KeyA') - ctl.ail) * k;
  ctl.rud  += (tgt('KeyE', 'KeyQ') - ctl.rud) * k;
  st.thr = clamp(st.thr + ((keys.ShiftLeft || keys.ShiftRight ? 1 : 0) - (keys.KeyC ? 1 : 0)) * 0.4 * dt, 0, 1);

  const inv = st.q.clone().invert();
  const vL = st.vel.clone().applyQuaternion(inv);
  const V = st.vel.length();
  const aoa = V > 2 ? Math.atan2(-vL.y, Math.max(-vL.z, 0.1)) : 0;
  const beta = V > 2 ? Math.asin(clamp(vL.x / V, -1, 1)) : 0;
  const q = 0.5 * RHO * V * V;
  const cl = CL(aoa);
  const cd = 0.03 + 0.057 * cl * cl;

  const F = new V3();
  F.y += q * C.wing * cl;
  if (V > 0.01) F.addScaledVector(vL, -q * C.wing * cd / V);
  F.x += -q * C.wing * 0.9 * beta;
  F.z -= st.thr * C.thrust(V);
  const Fw = F.applyQuaternion(st.q);
  Fw.y -= G * C.mass;

  st.vel.addScaledVector(Fw, dt / C.mass);
  st.pos.addScaledVector(st.vel, dt);

  const qf = Math.min(q / QREF, 2.5);
  const ce = Math.max(qf, 0.12), sc = Math.sqrt(ce);
  const a = clamp(aoa, -0.6, 0.6);
  const pitchAcc = C.pitch * ctl.elev * ce - 4.0 * (a - 0.05) * qf - 2.2 * st.w.x * sc;
  const r = -st.w.z;
  const rollAcc = C.roll * ctl.ail * ce - C.rollD * r * sc - 1.0 * beta * qf;
  const yawAcc = -C.yaw * ctl.rud * ce - 3.0 * beta * qf - 2.0 * st.w.y * sc;
  st.w.x += pitchAcc * dt;
  st.w.z -= rollAcc * dt;
  st.w.y += yawAcc * dt;

  let grounded = false;
  const gy = C.HG + terrainH(st.pos.x, st.pos.z);
  if (st.pos.y <= gy) {
    grounded = true;
    st.pos.y = gy;
    if (st.vel.y < 0) st.vel.y = 0;
    const mu = 0.02 + (keys.Space ? 0.45 : 0);
    const sp = Math.hypot(st.vel.x, st.vel.z);
    if (sp > 0.001) {
      const dec = Math.min(sp, mu * G * dt);
      st.vel.x -= st.vel.x / sp * dec; st.vel.z -= st.vel.z / sp * dec;
    }
    const right = new V3(1, 0, 0).applyQuaternion(st.q);
    st.vel.addScaledVector(right, -st.vel.dot(right) * Math.min(1, 8 * dt));
    st.w.z = 0;
    st.w.y = -ctl.rud * C.steer * clamp(sp / 5, 0, 1);                       // nosewheel steering
    const e = new Euler().setFromQuaternion(st.q, 'YXZ');
    e.z = 0;
    if (e.x < 0) { e.x = 0; if (st.w.x < 0) st.w.x = 0; }
    if (e.x > C.gPitch) { e.x = C.gPitch; if (st.w.x > 0) st.w.x = 0; }
    st.q.setFromEuler(e);
  }

  if (!grounded) {                                                           // airspeed follows throttle only
    const sp = st.vel.length();
    if (sp > 0.1) {
      const tgtV = C.vIdle + st.thr * C.vRange;
      const nsp = sp + clamp((tgtV - sp) * 0.8, -5, C.acc) * dt;
      st.vel.multiplyScalar(nsp / sp);
    }
  }

  const ang = st.w.length() * dt;
  if (ang > 1e-9) st.q.multiply(new Q().setFromAxisAngle(st.w.clone().normalize(), ang)).normalize();
  info = { aoa, V, air: !grounded };
}

let gearUp = false, gearT = 0, wasHigh = false;                  // gear retracts after takeoff; G toggles it while airborne
function reset() {
  gearUp = false; gearT = 0; wasHigh = false;
  st.pos.set(0, C.HG, 0); st.vel.set(0, 0, 0); st.q.identity(); st.w.set(0, 0, 0); st.thr = 0;
  ctl.elev = ctl.ail = ctl.rud = 0;
}

// ---------- procedural world: chunked terrain, trees, suburbs, cities, clouds, runway ----------
const CH = 500, RAD = 5, TILE = 100;                             // chunk size (m), load radius (chunks)
const hash2 = (x, z, s = 0) => {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(z | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
};
const rngFor = (cx, cz, s) => {                                  // deterministic per-chunk random stream, so a chunk always regenerates identically
  let a = (Math.imul(cx, 73856093) ^ Math.imul(cz, 19349663) ^ Math.imul(s, 83492791)) >>> 0 || 1;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
};
const vnoise = (x, z, s) => {
  const x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash2(x0, z0, s), b = hash2(x0 + 1, z0, s), c = hash2(x0, z0 + 1, s), d = hash2(x0 + 1, z0 + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
};
function biome(cx, cz) {
  const far = clamp((Math.hypot(cx, cz) - 2.5) / 2.5, 0, 1);      // keep the airport in open countryside
  const v = vnoise(cx * 0.17, cz * 0.17, 1) * far, f = vnoise(cx * 0.3 + 40, cz * 0.3 - 17, 2);
  if (v > 0.72) return { t: 'city', k: clamp((v - 0.72) / 0.12, 0, 1) };
  if (v > 0.62) return { t: 'suburb', k: 0 };
  if (f > 0.6 && far > 0.4) return { t: 'forest', k: 0 };
  return { t: 'farm', k: 0 };
}
const airportZone = (x, z) => Math.abs(x) < 320 && z > -3100 && z < 600;   // nothing is built over the runway area

// textures (all procedural canvases)
const rep = (t, n) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(n, n); return t; };

  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  acc += dt;
  while (acc >= 1 / 120) { step(1 / 120); acc -= 1 / 120; }

  model.position.copy(st.pos);
  model.quaternion.copy(st.q);
  const alt = st.pos.y - C.HG;
  if (!info.air) { gearUp = false; wasHigh = false; }
  else if (alt > 5 && !wasHigh) { wasHigh = true; gearUp = true; }   // auto-retract once clearly off the ground
  gearT = clamp(gearT + (gearUp ? 1 : -1) * dt * 0.5, 0, 1);
  const gs = model.userData.gear;
  if (gs) for (const p of gs) { p.visible = gearT < 0.98; p.scale.setScalar(Math.max(1 - gearT, 0.001)); }
  const pr = model.userData.prop;
  if (pr) pr.rotation.z += (4 + st.thr * 70) * dt;
  const fans = model.userData.fans;
  if (fans) {                                                    // capped so the blades never alias on screen
    const w = (3 + st.thr * 17) * dt;
    for (const f of fans) f.rotation.z += w * f.userData.dir;
    model.userData.blur.opacity = st.thr * 0.45;
  }
  updateWorld(st.pos, 5);                                        // stream chunks in/out around the plane (time-budgeted)

  const yaw = new Euler().setFromQuaternion(st.q, 'YXZ').y;
  heading += wrap(yaw - heading) * Math.min(1, dt * 3);
  const az = heading + look.yaw, el = look.pitch;
  camera.position.set(
    st.pos.x + Math.sin(az) * Math.cos(el) * dist,
    st.pos.y + C.look * 1.2 + Math.sin(el) * dist,
    st.pos.z + Math.cos(az) * Math.cos(el) * dist);
  camera.position.y = Math.max(camera.position.y, terrainH(camera.position.x, camera.position.z) + 0.8);
  camera.lookAt(st.pos.x, st.pos.y + C.look, st.pos.z);

  const sk = Math.min(Math.max(st.pos.y, 0), 500) * 0.5 / SUN.y, sx = Math.round((st.pos.x - SUN.x * sk) / 10) * 10, sz = Math.round((st.pos.z - SUN.z * sk) / 10) * 10;
  sun.target.position.set(sx, 0, sz); sun.position.set(sx + SUN.x * 800, SUN.y * 800, sz + SUN.z * 800);   // shadow box centred around the plane and its shadow
  cullWorld(camera);                                             // hide chunk parts that are behind/outside the view or too far to matter
  sortClouds(camera.position);
  farGround.position.set(camera.position.x, -6, camera.position.z);
  updateSunFx(dt);
  updateFlightAudio();
  renderer.render(scene, camera);

  hudT += dt;
  if (hudT > 0.1) {
    hudT = 0;
    hud.innerHTML = `${C.name}<br>${(info.V * 1.944).toFixed(0)} kt · ${((st.pos.y - C.HG) * 3.281).toFixed(0)} ft · thr ${(st.thr * 100).toFixed(0)}% · gear ${gearT > 0.98 ? 'up' : gearT < 0.02 ? 'down' : 'moving'}<br>world ${worldStat}`;
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
